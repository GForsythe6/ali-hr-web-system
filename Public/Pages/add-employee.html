<!-- Public/Pages/add-employee.html -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Add Employee</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

    <!-- SIDEBAR -->
    <div id="sidebar"></div>

    <!-- MAIN -->
    <main
        id="mainContent"
        class="
        ml-64
        p-8
        ">

        <!-- HEADER -->
        <div class="mb-8">

            <a
                href="/Pages/employees.html"
                class="
                text-[#2F4B8F]
                font-semibold
                inline-block
                mb-4
                ">

                ← Back to Employees

            </a>

            <h1
                class="
                text-6xl
                font-bold
                text-[#2F4B8F]
                ">

                Add Employee

            </h1>

        </div>

        <!-- CARD -->
        <div
            class="
            bg-white
            rounded-3xl
            shadow
            p-10
            max-w-5xl
            ">

            <form id="employeeForm">

                <div
                    class="
                    grid
                    grid-cols-2
                    gap-8
                    ">

                    <!-- FIRST NAME -->
                    <div>

                        <label class="form-label">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            class="form-input"
                            required>

                    </div>

                    <!-- LAST NAME -->
                    <div>

                        <label class="form-label">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            class="form-input"
                            required>

                    </div>

                </div>

                <!-- BUTTONS -->
                <div
                    class="
                    mt-10
                    flex
                    gap-4
                    ">

                    <!-- CANCEL -->
                    <button
                        type="button"
                        onclick="window.location.href='/Pages/employees.html'"
                        class="
                        border
                        border-gray-300
                        bg-white
                        hover:bg-gray-100
                        text-gray-700
                        px-10
                        py-4
                        rounded-2xl
                        font-semibold
                        transition
                        ">

                        Cancel

                    </button>

                    <!-- SAVE -->
                    <button
                        type="submit"
                        class="
                        bg-[#2F4B8F]
                        hover:bg-[#4B9AD6]
                        text-white
                        px-10
                        py-4
                        rounded-2xl
                        font-semibold
                        transition
                        shadow
                        ">

                        Save Employee

                    </button>

                </div>

            </form>

        </div>

    </main>

    <!-- SIDEBAR -->
    <script src="/js/layout.js"></script>

    <!-- FORM SCRIPT -->
    <script>

        document
            .getElementById(
                "employeeForm"
            )
            .addEventListener(
                "submit",
                async (e) => {

                    e.preventDefault();

                    const employeeData = {

                        firstName:
                            document.getElementById(
                                "firstName"
                            ).value,

                        lastName:
                            document.getElementById(
                                "lastName"
                            ).value

                    };

                    try {

                        const response =
                            await fetch(
                                "/api/employees",
                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json"

                                    },

                                    body: JSON.stringify(
                                        employeeData
                                    )

                                }
                            );

                        const result =
                            await response.json();

                        console.log(result);

                        if(result.success){

                            alert(
                                "Employee added successfully!"
                            );

                            window.location.href =
                                "/Pages/employees.html";

                        } else {

                            alert(
                                "Failed to add employee"
                            );

                        }

                    } catch(error){

                        console.error(error);

                        alert(
                            "Server Error"
                        );

                    }

                }
            );

    </script>

    <!-- STYLE -->
    <style>

        .form-label{

            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #374151;

        }

        .form-input{

            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #D1D5DB;
            outline: none;

        }

        .form-input:focus{

            border-color: #4B9AD6;

        }

    </style>

</body>

</html>
