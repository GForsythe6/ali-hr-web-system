<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="/css/output.css">

</head>

<body class="bg-gray-100">

    <!-- SIDEBAR -->
    <div id="sidebar"></div>

    <!-- MAIN CONTENT -->
    <div id="mainContent"
        class="ml-64 p-10 transition-all duration-300">

        <h1 class="text-4xl font-bold page-title mb-8">
            Dashboard
        </h1>

        <!-- CARDS -->
        <div class="grid grid-cols-4 gap-6">

            <div class="card">

                <h2 class="text-gray-500">
                    Total Employees
                </h2>

                <p class="text-4xl font-bold mt-3">
                    245
                </p>

            </div>

            <div class="card">

                <h2 class="text-gray-500">
                    WFH
                </h2>

                <p class="text-4xl font-bold mt-3">
                    78
                </p>

            </div>

            <div class="card">

                <h2 class="text-gray-500">
                    Onsite
                </h2>

                <p class="text-4xl font-bold mt-3">
                    167
                </p>

            </div>

            <div class="card">

                <h2 class="text-gray-500">
                    Pending Leaves
                </h2>

                <p class="text-4xl font-bold mt-3">
                    12
                </p>

            </div>

        </div>

    </div>

    <script src="/js/layout.js"></script>

</body>
</html>
