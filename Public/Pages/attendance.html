<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance | ALI HR</title>

    <link rel="stylesheet" href="/css/output.css">

</head>

<body class="bg-gray-100">

    <div id="sidebar"></div>

    <div id="mainContent" class="ml-64 transition-all duration-300">

        <div id="topbar"></div>

        <div class="p-8">

            <div class="flex justify-between items-center mb-8">

                <h1 class="text-4xl font-bold text-[#23408E]">
                    Attendance
                </h1>

                <button class="bg-[#23408E] text-white px-6 py-3 rounded-xl hover:bg-[#4B9AD6]">
                    + Data Entry
                </button>

            </div>

            <!-- CARDS -->
            <div class="grid grid-cols-4 gap-6 mb-8">

                <div class="bg-white p-6 rounded-2xl shadow">
                    <h2 class="text-gray-500">Present</h2>
                    <p class="text-4xl font-bold mt-2">210</p>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow">
                    <h2 class="text-gray-500">Absent</h2>
                    <p class="text-4xl font-bold mt-2">12</p>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow">
                    <h2 class="text-gray-500">Late</h2>
                    <p class="text-4xl font-bold mt-2">8</p>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow">
                    <h2 class="text-gray-500">On Leave</h2>
                    <p class="text-4xl font-bold mt-2">15</p>
                </div>

            </div>

            <!-- TABLE -->
            <div class="bg-white rounded-2xl shadow p-6">

                <h2 class="text-2xl font-semibold mb-4">
                    Daily Attendance
                </h2>

                <table class="w-full">

                    <thead>

                        <tr class="border-b">

                            <th class="text-left py-3">Employee</th>
                            <th class="text-left py-3">Time In</th>
                            <th class="text-left py-3">Time Out</th>
                            <th class="text-left py-3">Status</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr class="border-b">

                            <td class="py-4">Glenn Ugay</td>
                            <td>8:00 AM</td>
                            <td>5:00 PM</td>
                            <td class="text-green-600 font-semibold">
                                Present
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="/js/layout.js"></script>

</body>
</html>
