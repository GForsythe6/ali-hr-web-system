<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports | ALI HR</title>

    <link rel="stylesheet" href="/css/output.css">

</head>

<body class="bg-gray-100">

    <div id="sidebar"></div>

    <div id="mainContent" class="ml-64 transition-all duration-300">

        <div id="topbar"></div>

        <div class="p-8">

            <div class="flex justify-between items-center mb-8">

                <h1 class="text-4xl font-bold text-[#23408E]">
                    Reports
                </h1>

                <button class="bg-[#23408E] text-white px-6 py-3 rounded-xl hover:bg-[#4B9AD6]">
                    Generate Report
                </button>

            </div>

            <!-- REPORT CARDS -->
            <div class="grid grid-cols-3 gap-6">

                <div class="bg-white rounded-2xl shadow p-8">

                    <h2 class="text-2xl font-semibold mb-3">
                        Attendance Report
                    </h2>

                    <p class="text-gray-500 mb-6">
                        Monthly attendance analytics and summaries.
                    </p>

                    <button class="bg-[#23408E] text-white px-5 py-2 rounded-lg">
                        View Report
                    </button>

                </div>

                <div class="bg-white rounded-2xl shadow p-8">

                    <h2 class="text-2xl font-semibold mb-3">
                        Leave Report
                    </h2>

                    <p class="text-gray-500 mb-6">
                        Employee leave requests and balances.
                    </p>

                    <button class="bg-[#23408E] text-white px-5 py-2 rounded-lg">
                        View Report
                    </button>

                </div>

                <div class="bg-white rounded-2xl shadow p-8">

                    <h2 class="text-2xl font-semibold mb-3">
                        Employee Report
                    </h2>

                    <p class="text-gray-500 mb-6">
                        Employee records and workforce overview.
                    </p>

                    <button class="bg-[#23408E] text-white px-5 py-2 rounded-lg">
                        View Report
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="/js/layout.js"></script>

</body>
</html>
